services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: dream-dify-complete:local
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    ports:
      - "127.0.0.1:${DREAM_HTTP_PORT:-8080}:8080"
    volumes:
      - dream-dify-data:/data
    environment:
      DREAM_TRUSTED_PROXY_IPS: "${DREAM_TRUSTED_PROXY_IPS:-127.0.0.1,172.17.0.1}"
volumes:
  dream-dify-data:
