<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦境失物招领局</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#253247;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:50px auto;padding:24px}.eyebrow{letter-spacing:4px;font-size:12px;color:#5c6f75}h1{font-size:40px;margin:14px 0}p{line-height:1.7;color:#5b6674}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;margin-top:30px}.card{background:white;border:1px solid #dcd9cf;border-radius:18px;padding:24px}label{display:block;font-size:13px;margin-bottom:18px}input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cbd0d2;border-radius:9px;margin-top:7px;resize:vertical}button{width:100%;border:0;border-radius:9px;padding:13px;background:#214e57;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#story{white-space:pre-wrap;line-height:1.9;font-size:15px;min-height:280px}.badge{display:inline-block;font-size:12px;padding:6px 10px;background:#e8f0e9;border-radius:20px;margin:14px 6px 0 0}.trace{font-size:11px;overflow-wrap:anywhere;color:#77818a;margin-top:22px}footer{font-size:12px;color:#7b858b;margin-top:24px}#status{font-size:13px;margin:12px 0;color:#5e6e75}@media(max-width:740px){main{margin:12px auto}.layout{grid-template-columns:1fr}h1{font-size:30px}}</style>
<main><div class="eyebrow">DREAM LOST & FOUND · 夜班营业</div><h1>你把什么落在了梦里？</h1><p>一把会说话的雨伞，一颗不肯下班的星星。告诉夜班柜员你的失物，让故事继续。<br>填写同一昵称再次登记，柜员会翻出你以前的记录。</p><div class="layout"><form class="card" id="form"><label>玩家昵称<input id="player" maxlength="32" required placeholder="试试一个独特的虚构昵称"></label><label>梦里的失物<input id="item" maxlength="250" required value="会说话的蓝雨伞"></label><label>你想做什么<textarea id="action" maxlength="200" rows="4" required>给雨伞写一封道歉信</textarea></label><button id="submit">交给夜班柜员</button><div id="status">首次登记后，试试问柜员上次发生了什么。</div></form><section class="card"><div id="story">欢迎来到梦境失物招领局。窗外正在下昨晚没下完的雨，柜员为你的失物留了一格空抽屉。</div><div id="badges"></div><div class="trace" id="trace"></div></section></div><footer>只填写虚构情节。体验入口由真实 Dify Workflow 编排，PowerContext 保存并检索记忆，本地 Qwen 生成回复。临时演示随本机服务运行。</footer></main><script>
const $=x=>document.getElementById(x);$("player").value="梦游访客-"+Math.random().toString(36).slice(2,8);$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="柜员正在翻找抽屉，通常需要几秒到半分钟…";try{const r=await fetch("/api/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({player_name:$("player").value,lost_item:$("item").value,action:$("action").value})});const d=await r.json();if(!r.ok)throw Error(d.detail||"服务暂时繁忙");$("story").textContent=d.result;$("badges").replaceChildren();for(const text of ["读取历史："+d.previous_memory_loaded,"本轮记忆保存："+d.memory_saved]){const b=document.createElement("span");b.className="badge";b.textContent=text;$("badges").append(b)}$("trace").textContent="Dify 工作流记录："+d.workflow_run_id;$("status").textContent="登记完成。保留昵称，换一个行动继续故事。";$("action").value="询问柜员上次登记了什么";}catch(err){$("status").textContent=err.message}finally{$("submit").disabled=false}};
</script></html>
