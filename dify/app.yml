    - data:
        code: "import hashlib, json, re\n\ndef main(player_name: str, lost_item: str,\
          \ action: str) -> dict:\n    player = re.sub(r'\\s+', ' ', str(player_name)).strip()[:32]\n\
          \    item = str(lost_item).strip()[:250]\n    move = str(action).strip()[:200]\n\
          \    if not player or not item or not move:\n        raise ValueError('昵称、失物和行动不能为空')\n\
          \    # Same nickname => same scope; never use a model-written ID as an authority.\n\
          \    key = hashlib.sha256(('dream-lostfound-v1:' + player).encode('utf-8')).hexdigest()\n\
          \    payload = {\n        'title': '梦境失物局 - ' + player,\n        'summary':\
          \ 'Dify互动小游戏的玩家剧情记忆，请勿存储现实身份或隐私信息',\n        'idempotency_key': 'lostfound-'\
          \ + key\n    }\n    return {'payload': json.dumps(payload, ensure_ascii=False),\n\
          \            'player': player, 'item': item, 'move': move}\n"
        code_language: python3
        desc: ''
        outputs:
          item:
            children: null
            type: string
          move:
            children: null
            type: string
          payload:
            children: null
            type: string
          player:
            children: null
            type: string
