    - data:
        code: "import json\n\ndef main(body: str, status_code: int) -> dict:\n   \
          \ code = int(status_code)\n    if code < 200 or code >= 300:\n        raise\
          \ ValueError('PowerContext 创建Scope失败，HTTP ' + str(code))\n    reply = json.loads(body)\n\
          \    sid = reply.get('scope_id')\n    if not isinstance(sid, str) or not\
          \ sid.strip():\n        raise ValueError('PowerContext没有返回有效scope_id')\n\
          \    return {'scope_id': sid}\n"
        code_language: python3
        desc: ''
        outputs:
